/* Refined premium audio-operator header */
.top{
  position:relative;isolation:isolate;overflow:hidden;
  background:linear-gradient(118deg,#0b202b 0%,#103d49 52%,#116d70 100%);
  border-bottom:1px solid rgba(165,235,225,.2);
  padding:18px max(18px,calc((100% - 1100px)/2));

}

  content:"";position:absolute;z-index:-1;inset:0;pointer-events:none;
  background:radial-gradient(circle at 82% 15%,rgba(105,235,210,.2),transparent 26%),radial-gradient(circle at 12% 120%,rgba(54,153,181,.22),transparent 34%),repeating-linear-gradient(135deg,transparent 0 18px,rgba(255,255,255,.018) 18px 19px);
}
.top:before{
  content:"♫";font-family:Tahoma,sans-serif;font-size:29px;font-weight:700;
  width:54px;height:54px;flex:0 0 54px;display:grid;place-items:center;

}

</head><body>
<header class="top" id="homeHeader" title="بازگشت به صفحه اصلی"><div id="homeBrand" role="button" tabindex="0" aria-label="بازگشت به صفحه اصلی"><small>دفتر کار اپراتور صوت</small><h1>پنل اپراتور</h1></div><div class="top-actions" style="display:flex;gap:8px;flex-wrap:wrap"><button id="invoiceJpgGlobal" class="light">خروجی عکس فاکتور</button><button id="backupBtn" class="light">پشتیبان‌گیری</button></div></header>
<nav class="nav"><button data-view="dashboard" class="active">داشبورد</button><button data-view="jobs">کارها</button><button data-view="finance">حساب مالی</button><button data-view="reports">گزارش‌ها</button><button data-view="settings">تنظیمات</button></nav>
<main id="app" class="wrap"></main>
<div id="toast" role="status" class="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
(() => {
'use strict';
const DB='voice_operator_book_v1', STORE='data';
const $=s=>document.querySelector(s), app=$('#app'), toastEl=$('#toast');
let state={view:'dashboard',jobs:[],receipts:[],settings:{name:'',operatorId:'',currency:'تومان'},editing:null,filter:{q:'',month:'',status:'',type:''}};
const uid=()=>crypto.randomUUID?crypto.randomUUID():('id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
const nowISO=()=>new Date().toISOString();
function toast(s){toastEl.textContent=s;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),2800)}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function load(){try{const db=await openDB();return await new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).get('all');r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}catch(e){toast('خطا در بازکردن پایگاه داده');return null}}
async function save(){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(stateData(),'all');tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function stateData(){return {jobs:state.jobs,receipts:state.receipts,settings:state.settings}}
function faNum(n){return new Intl.NumberFormat('fa-IR').format(Math.round(Number(n)||0))}
function money(n){return faNum(n)+' '+(state.settings.currency||'تومان')}
function parseMoney(v){return Number(String(v??'').replace(/[٬,\s]/g,'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)))||0}
function formatMoneyInput(el){if(!el)return;const raw=String(el.value).replace(/[٬,\s]/g,'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[^0-9]/g,'');el.value=raw?new Intl.NumberFormat('fa-IR').format(Number(raw)):''}
function dateDisplay(iso){return jalali(iso)}
function isoDate(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function jalali(s){if(!s)return '—';try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(s+'T12:00:00'))}catch{return s}}
function weekday(s){try{return new Intl.DateTimeFormat('fa-IR',{weekday:'long'}).format(new Date(s+'T12:00:00'))}catch{return ''}}
function paidFor(job){return state.receipts.filter(r=>r.jobId===job.id).reduce((a,r)=>a+Number(r.amount||0),0)}
function jobStatus(j){let p=paidFor(j);return p<=0?'unpaid':p>=Number(j.amount)?'paid':'partial'}
function statusLabel(s){return s==='paid'?'تسویه‌شده':s==='partial'?'تسویه جزئی':'تسویه‌نشده'}
function total(arr,key='amount'){return arr.reduce((a,x)=>a+Number(x[key]||0),0)}
function monthNow(){return isoDate().slice(0,7)}
function nav(){document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===state.view);b.onclick=()=>{state.view=b.dataset.view;render()}})}
function stat(label,val){return `<div class="card stat"><span>${label}</span><strong>${val}</strong></div>`}
function jobRows(jobs){if(!jobs.length)return '<div class="empty">هنوز کاری ثبت نشده است.</div>';return `<div class="tablewrap"><table><thead><tr><th>تاریخ</th><th>شرح کار</th><th>نوع</th><th>مبلغ</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>${jobs.map(j=>`<tr><td>${jalali(j.date)}<div class="muted">${weekday(j.date)}</div></td><td>${esc(j.description||'—')}<div class="muted">${esc(j.client||'')}</div></td><td>${esc(j.type||'—')}</td><td>${money(j.amount)}</td><td><span class="pill ${jobStatus(j)}">${statusLabel(jobStatus(j))}</span></td><td><button class="smallbtn secondary" data-edit="${j.id}">ویرایش</button> <button class="smallbtn danger" data-del="${j.id}">حذف</button> <button class="smallbtn secondary" data-copy="${j.id}">کپی</button></td></tr>`).join('')}</tbody></table></div>`}
function bindJobButtons(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const j=state.jobs.find(x=>x.id===b.dataset.edit);if(!j)return;state.editing=j;state.view='dashboard';render();fillQuickForm(j);window.scrollTo({top:0,behavior:'smooth'});toast('برنامه برای ویرایش در فرم بالای صفحه قرار گرفت')});document.querySelectorAll('[data-paid]').forEach(b=>b.onclick=async()=>{const j=state.jobs.find(x=>x.id===b.dataset.paid);if(!j||jobStatus(j)==='paid')return;const remaining=Math.max(0,Number(j.amount)-paidFor(j));if(!remaining){toast('این برنامه قبلاً تسویه شده است');return}if(!confirm(`پرداخت مبلغ ${money(remaining)} برای «${j.description}» ثبت شود؟`))return;const now=nowISO();state.receipts.push({id:uid(),date:isoDate(),amount:remaining,jobId:j.id,method:'پرداخت ثبت‌شده از فهرست برنامه‌ها',notes:'ثبت پرداخت از دکمه برنامه',createdAt:now,updatedAt:now});await save();render();toast('پرداخت برنامه ثبت شد')});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('این کار حذف شود؟ دریافت‌های متصل به آن نیز حذف می‌شوند.'))return;let id=b.dataset.del;state.jobs=state.jobs.filter(j=>j.id!==id);state.receipts=state.receipts.filter(r=>r.jobId!==id);await save();render();toast('کار حذف شد')});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{let j=state.jobs.find(x=>x.id===b.dataset.copy);jobForm({...j,id:'',date:isoDate(),description:j.description+' (کپی)'})})}
function dashboard(){let today=isoDate(),m=monthNow(),todayJobs=state.jobs.filter(j=>j.date===today),monthJobs=state.jobs.filter(j=>j.date.startsWith(m)),earned=total(state.jobs),received=total(state.receipts),due=Math.max(0,earned-received);let list=[...state.jobs].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="mobile-dashboard">
<div class="grid stats-grid">${stat('مجموع درآمد ثبت‌شده',money(earned))}${stat('مجموع دریافتی‌ها',money(received))}${stat('مجموع طلب‌های باقی‌مانده',money(due))}${stat('تعداد کل برنامه‌ها',faNum(state.jobs.length))}${stat('برنامه‌های بدون مبلغ',faNum(state.jobs.filter(j=>!Number(j.amount)).length))}${stat('دریافت‌شده / پرداخت‌نشده',faNum(state.jobs.filter(j=>jobStatus(j)==='paid').length)+' / '+faNum(state.jobs.filter(j=>jobStatus(j)!=='paid').length))}</div>
<section class="card quick-form-card"><div class="section-title"><h2 id="quickFormTitle">ثبت برنامه جدید</h2></div><p class="muted">عنوان و تاریخ را وارد کنید؛ مبلغ اختیاری است.</p><form id="quickJobForm"><div class="field"><label>عنوان برنامه <b class="required">*</b></label><input name="description" required placeholder="مثلاً عروسی یا سرخاکی"></div>

const jalaliMonths=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function jalaliParts(iso){const d=new Date(iso+'T12:00:00');const parts=new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(d);const o={};parts.forEach(p=>{if(p.type==='year'||p.type==='month'||p.type==='day')o[p.type]=Number(p.value)});return o}
function isoLocal(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function jalaliCalendarHTML(selected,year,month){const dates=[];const approx=year+621;for(let t=new Date(approx-1,2,1,12);t<=new Date(approx+1,8,1,12);t.setDate(t.getDate()+1)){const iso=isoLocal(t),p=jalaliParts(iso);if(p.year===year&&p.month===month)dates.push({iso,day:p.day,weekday:t.getDay()})}if(!dates.length)return '<div class="empty">تقویم در دسترس نیست؛ تاریخ را دوباره انتخاب کنید.</div>';const offset=(dates[0].weekday+1)%7;let html='<div class="jalali-week">'+['ش','ی','د','س','چ','پ','ج'].map(x=>`<span>${x}</span>`).join('')+'</div><div class="jalali-days">';for(let i=0;i<offset;i++)html+='<span class="cal-empty"></span>';for(const d of dates)html+=`<button type="button" class="cal-day ${d.iso===selected?'selected':''} ${d.iso===isoDate()?'today':''}" data-date="${d.iso}">${faNum(d.day)}</button>`;return html+'</div>'}
function openJalaliCalendar(input){let picked=input.value||isoDate(),parts=jalaliParts(picked),year=parts.year,month=parts.month;const overlay=document.createElement('div');overlay.className='calendar-backdrop';overlay.style.zIndex='100000';overlay.innerHTML=`<section class="calendar-modal" role="dialog" aria-modal="true" aria-label="انتخاب تاریخ شمسی"><div class="calendar-head"><button type="button" class="secondary" id="calPrev" aria-label="ماه قبل">‹</button><strong id="calTitle"></strong><button type="button" class="secondary" id="calNext" aria-label="ماه بعد">›</button></div><div id="calBody"></div><div class="calendar-footer"><button type="button" class="secondary" id="calToday">رفتن به امروز</button><button type="button" class="secondary" id="calCancel">انصراف</button></div></section>`;document.body.appendChild(overlay);function draw(){ $('#calTitle').textContent=jalaliMonths[month-1]+' '+faNum(year);$('#calBody').innerHTML=jalaliCalendarHTML(picked,year,month);overlay.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{picked=b.dataset.date;input.value=picked;const display=document.getElementById(input.dataset.displayId);if(display)display.value=jalali(picked);input.dispatchEvent(new Event('change',{bubbles:true}));overlay.remove()})}function shift(n){month+=n;if(month<1){month=12;year--}if(month>12){month=1;year++}draw()}overlay.querySelector('#calPrev').onclick=()=>shift(-1);overlay.querySelector('#calNext').onclick=()=>shift(1);overlay.querySelector('#calToday').onclick=()=>{picked=isoDate();const p=jalaliParts(picked);year=p.year;month=p.month;draw()};overlay.querySelector('#calCancel').onclick=()=>overlay.remove();overlay.onclick=e=>{if(e.target===overlay)overlay.remove()};draw()}
function jobForm(j=null){state.editing=j;const x=j||{date:isoDate(),client:'',description:'',type:'اپراتوری',quantity:1,rate:0,amount:0,notes:''};app.innerHTML=`<div class="section-title"><h2>${j&&j.id?'ویرایش کار':'ثبت کار جدید'}</h2><button class="secondary" id="backJobs">بازگشت</button></div><div class="card"><form id="jobForm"><div class="formgrid">

$('#backJobs').onclick=()=>{state.view='jobs';render()};const f=$('#jobForm');$('#openCalendar').onclick=()=>openJalaliCalendar(f.date);f.date.onchange=()=>$('#weekday').textContent=jalali(f.date.value)+' — '+weekday(f.date.value);$('#calc').onclick=()=>{f.amount.value=faNum(Math.round((Number(f.quantity.value)||0)*parseMoney(f.rate.value)));};f.querySelectorAll('.money-input').forEach(el=>{el.addEventListener('input',()=>formatMoneyInput(el));formatMoneyInput(el)});
async function persistJob(e,next=false){if(e)e.preventDefault();let d=new FormData(f),old=j&&j.id?j:null;let obj={id:old?old.id:uid(),date:d.get('date'),client:d.get('client').trim(),description:d.get('description').trim(),type:d.get('type').trim(),quantity:Number(d.get('quantity')||0),rate:parseMoney(d.get('rate')),amount:Math.max(0,parseMoney(d.get('amount'))),notes:d.get('notes').trim(),updatedAt:nowISO(),createdAt:old?.createdAt||nowISO()};if(!obj.date||!obj.description||!obj.type||!Number.isFinite(obj.amount)){toast('لطفاً اطلاعات معتبر وارد کنید');return}if(old)state.jobs=state.jobs.map(a=>a.id===old.id?obj:a);else state.jobs.push(obj);await save();if(next){jobForm();toast('کار ذخیره شد؛ کار بعدی را وارد کنید')}else{state.view='jobs';render();toast('کار با موفقیت ذخیره شد')}}f.onsubmit=e=>persistJob(e,false);$('#saveNext').onclick=()=>persistJob(null,true)}

function monthlyBars(){let map={};state.jobs.forEach(j=>map[j.date.slice(0,7)]=(map[j.date.slice(0,7)]||0)+Number(j.amount));let entries=Object.entries(map).sort().slice(-8);if(!entries.length)return '<div class="empty">برای نمایش نمودار، کار ثبت کنید.</div>';let max=Math.max(...entries.map(x=>x[1]),1);return entries.map(([m,v])=>`<div style="margin:12px 0"><div class="row"><span>${jalali(m+'-15').slice(0,7)}</span><b>${money(v)}</b></div><div style="height:9px;background:#eaf0f2;border-radius:9px;overflow:hidden"><div style="height:100%;width:${v/max*100}%;background:#20818a;border-radius:9px"></div></div></div>`).join('')}

function bindDashboard(){const f=$('#quickJobForm');if(!f)return;$('#quickCalendar').onclick=()=>openJalaliCalendar(f.date);f.date.onchange=()=>{$('#quickWeekday').textContent=weekday(f.date.value);$('#quickDateDisplay').value=jalali(f.date.value)};const quickAmount=f.querySelector('.money-input');quickAmount.addEventListener('input',()=>formatMoneyInput(quickAmount));f.onsubmit=async e=>{e.preventDefault();const d=new FormData(f),amount=Math.max(0,parseMoney(d.get('amount'))),date=d.get('date'),description=String(d.get('description')||'').trim(),notes=String(d.get('notes')||'').trim();if(!date||!description){toast('عنوان و تاریخ را وارد کنید');return}const now=nowISO(),old=state.editing;let job;if(old){job={...old,date,description,amount,rate:amount,notes,updatedAt:now};state.jobs=state.jobs.map(x=>x.id===old.id?job:x);if(d.get('paidStatus')==='paid'&&jobStatus(job)!=='paid'&&amount>0){const rem=Math.max(0,amount-paidFor(job));if(rem)state.receipts.push({id:uid(),date:isoDate(),amount:rem,jobId:job.id,method:'پرداخت ثبت‌شده هنگام ویرایش',notes:'ثبت دریافت از فرم ویرایش',createdAt:now,updatedAt:now})}state.editing=null;await save();render();toast('تغییرات برنامه ذخیره شد')}else{const id=uid();job={id,date,client:'',description,type:'اپراتوری',quantity:1,rate:amount,amount,notes,updatedAt:now,createdAt:now};state.jobs.push(job);if(d.get('paidStatus')==='paid'&&amount>0)state.receipts.push({id:uid(),date,amount,jobId:id,method:'ثبت‌شده هنگام ایجاد برنامه',notes:'دریافت کامل ثبت‌شده از فرم برنامه',createdAt:now,updatedAt:now});await save();render();toast('برنامه ذخیره شد')}};$('#quickReset').onclick=e=>{setTimeout(()=>{clearQuickEdit()},0)};$('#quickCancelEdit').onclick=()=>{clearQuickEdit();toast('ویرایش لغو شد')};const filter=()=>{let q=($('#programSearch')?.value||'').trim().toLowerCase(),st=$('#programStatus')?.value||'',sort=$('#programSort')?.value||'new';let list=state.jobs.filter(j=>(!q||[j.description,j.notes,j.client].join(' ').toLowerCase().includes(q))&&(!st||(st==='paid'?jobStatus(j)==='paid':jobStatus(j)!=='paid')));list.sort((a,b)=>sort==='old'?a.date.localeCompare(b.date):sort==='amount'?Number(b.amount)-Number(a.amount):b.date.localeCompare(a.date));$('#programList').innerHTML=programCards(list);bindJobButtons()};$('#programSearch').oninput=filter;$('#programStatus').onchange=filter;$('#programSort').onchange=filter;$('#backupBtnInline').onclick=exportJSON;const invoiceBtn=$('#invoiceJpg');if(invoiceBtn)invoiceBtn.onclick=exportInvoiceJPG;$('#restoreBackup').onclick=()=>$('#importFile').click();$('#deleteAllData').onclick=async()=>{if(!confirm('تمام برنامه‌ها و دریافت‌های ثبت‌شده حذف شوند؟ ابتدا از اطلاعات پشتیبان بگیرید.'))return;state.jobs=[];state.receipts=[];await save();render();toast('اطلاعات حذف شد')};bindJobButtons()}
function bind(){const globalInvoiceBtn=$('#invoiceJpgGlobal');if(globalInvoiceBtn)globalInvoiceBtn.onclick=exportInvoiceJPG;let n=$('#newJob');if(n)n.onclick=()=>jobForm();let a=$('#allJobs');if(a)a.onclick=()=>{state.view='jobs';render()};if(state.view==='jobs'){['q','month','status','type'].forEach(id=>$('#'+id).onchange=()=>{state.filter[id==='q'?'q':id]= $('#'+id).value;render()});$('#q').oninput=()=>{state.filter.q=$('#q').value;const p=$('#q').selectionStart;render();$('#q').focus();$('#q').setSelectionRange(p,p)};bindJobButtons()}if(state.view==='finance'){let f=$('#receiptForm');f.onsubmit=async e=>{e.preventDefault();let d=new FormData(f),amount=Number(d.get('amount'));if(!(amount>0)){toast('مبلغ باید بیشتر از صفر باشد');return}state.receipts.push({id:uid(),date:d.get('date'),amount,jobId:d.get('jobId'),method:d.get('method'),notes:d.get('notes'),createdAt:nowISO(),updatedAt:nowISO()});await save();render();toast('دریافت ثبت شد')};document.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=async()=>{if(!confirm('این تراکنش حذف شود؟'))return;state.receipts=state.receipts.filter(r=>r.id!==b.dataset.rdel);await save();render();toast('تراکنش حذف شد')})}if(state.view==='reports'){if($('#csv'))$('#csv').onclick=csv;const invoiceBtn=$('#invoiceJpgReport');if(invoiceBtn)invoiceBtn.onclick=exportInvoiceJPG;$('#export').onclick=exportJSON;$('#import').onclick=()=>$('#importFile').click()}if(state.view==='settings')$('#settingsForm').onsubmit=async e=>{e.preventDefault();let d=new FormData(e.target);state.settings={name:d.get('name').trim(),operatorId:d.get('operatorId').trim(),currency:d.get('currency')};await save();render();toast('تنظیمات ذخیره شد')}}
function render(){nav();if(state.view==='dashboard')app.innerHTML=dashboard();else if(state.view==='jobs')app.innerHTML=jobsView();else if(state.view==='finance')app.innerHTML=finance();else if(state.view==='reports')app.innerHTML=reports();else app.innerHTML=settings();bind();if(state.view==='dashboard')bindDashboard()}
async function importBackup(file){try{let d=JSON.parse(await file.text());if(!d||!Array.isArray(d.jobs)||!Array.isArray(d.receipts)||!d.settings)throw Error('ساختار پشتیبان معتبر نیست');if(!confirm(`فایل شامل ${d.jobs.length} کار و ${d.receipts.length} دریافت است. اطلاعات فعلی جایگزین شود؟ قبل از ادامه، پشتیبان فعلی دانلود می‌شود.`))return;download('operator-backup-before-restore.json',JSON.stringify(stateData(),null,2));state.jobs=d.jobs;state.receipts=d.receipts;state.settings={...state.settings,...d.settings};await save();render();toast('بازیابی انجام شد')}catch(e){toast('فایل نامعتبر است یا خوانده نشد')}}
$('#backupBtn').onclick=exportJSON;
// Tapping the logo, microphone icon, or title returns to the dashboard; action buttons keep their own behavior.
function goHome(){if(state.view!=='dashboard'){state.editing=null;state.view='dashboard';render();window.scrollTo({top:0,behavior:'smooth'})}else{window.scrollTo({top:0,behavior:'smooth'})}}
$('#homeHeader').addEventListener('click',e=>{if(e.target.closest('button,a,input,select,textarea'))return;goHome()});
$('#homeBrand').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();goHome()}});
$('#importFile').onchange=e=>{if(e.target.files[0])importBackup(e.target.files[0]);e.target.value=''};
(async()=>{let d=await load();if(d){state.jobs=Array.isArray(d.jobs)?d.jobs:[];state.receipts=Array.isArray(d.receipts)?d.receipts:[];state.settings={...state.settings,...d.settings}}render()})();
})();
</script>
